<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find a tool · Hebri Lab</title>
<style>
  :root { color-scheme: light; --ink:#1b302c; --secondary:#4e645e; --green:#195544; --paper:#fafaf5; --line:#ccd6cb; font:16px/1.5 "Inter","Segoe UI",sans-serif; color:var(--ink); background:var(--paper); }
  * { box-sizing:border-box; }
  body { margin:0; }
  button,textarea { font:inherit; color:inherit; }
  button { cursor:pointer; }
  button:focus-visible,textarea:focus-visible { outline:3px solid #2e725c; outline-offset:3px; }
  [hidden] { display:none !important; }
  header { min-height:4rem; padding:.8rem clamp(1rem,4vw,4rem); display:flex; align-items:center; justify-content:space-between; gap:1rem; border-bottom:1px solid var(--line); }
  .brand { font-weight:700; letter-spacing:-.035em; font-size:1.16rem; }
  .brand::before { content:"H"; display:inline-grid; place-items:center; background:var(--green); color:white; width:1.7rem; height:1.7rem; margin-right:.55rem; border-radius:.35rem; font:italic bold 1.05rem Georgia,serif; }
  .muted { color:var(--secondary); font-size:.84rem; }
  .wrap { margin:clamp(2rem,7vh,5rem) auto; max-width:65rem; padding:0 clamp(1rem,3vw,2rem); }
  h1,h2,p { margin:0; }
  h1,h2 { font-family:"Baskervville",Georgia,serif; font-weight:normal; letter-spacing:-.04em; }
  h1 { font-size:clamp(2rem,5.8vw,3.6rem); line-height:1.1; margin-bottom:.65rem; }
  h2 { font-size:clamp(1.65rem,4vw,2.35rem); line-height:1.2; }
  .modes,.filters { display:flex; flex-wrap:wrap; gap:.4rem; }
  .modes { border-bottom:1px solid var(--line); margin:1.6rem 0; padding-bottom:.75rem; }
  .modes button,.filters button,.back { border:none; border-radius:.45rem; background:transparent; padding:.5rem .82rem; }
  .modes button[aria-pressed=true],.filters button[aria-pressed=true] { color:var(--green); background:#e2ebdf; font-weight:650; }
  button:hover { background:#eaf0e5; }
  .work { display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr); gap:clamp(1.5rem,5vw,4rem); align-items:start; }
  section>p { color:var(--secondary); margin:.45rem 0 1.1rem; }
  .filters { margin-bottom:.45rem; }
  .choices { display:grid; }
  .choices button { width:100%; background:transparent; display:grid; grid-template-columns:1fr auto; align-items:center; text-align:left; gap:.35rem; border:none; border-bottom:1px solid var(--line); padding:.9rem .65rem; }
  .choices button:hover,.choices button[aria-pressed=true] { background:#eff3e9; }
  .choices strong { display:block; }
  .choices small { color:var(--secondary); display:block; }
  aside { background:#eef2e9; padding:clamp(1rem,3vw,2rem); border-radius:.8rem; }
  aside h2 { margin:.3rem 0 .6rem; }
  aside p+p { margin-top:.7rem; }
  .example { margin-top:1.1rem; padding:.8rem 1rem; border-inline-start:3px solid #90a38e; background:#f8faf3; }
  .action { background:var(--green); color:white; font-weight:600; border:0; border-radius:.45rem; padding:.58rem .95rem; margin-top:1rem; }
  .action:hover { background:#246d56; }
  .draft { margin-top:1.1rem; }
  label { font-weight:600; font-size:.88rem; }
  textarea { display:block; width:100%; min-height:5.4rem; border:1px solid #a9b8a7; background:white; border-radius:.5rem; resize:vertical; padding:.7rem; margin:.35rem 0 1rem; }
  .tasks { margin:.8rem 0 .2rem; padding-inline-start:2rem; }
  .tasks li { padding:.34rem; border-bottom:1px solid var(--line); }
  @media(max-width:680px) { .work { grid-template-columns:minmax(0,1fr); gap:1.25rem; } .wrap { margin:1.8rem auto; } .modes { margin:1.1rem 0; } .modes button { padding:.45rem .6rem; } }
</style>
</head>
<body>
<header><span class="brand">Hebri Lab</span><span class="muted">Offline layout examples</span></header>
<main class="wrap">
  <h1>Find the right tool</h1>
  <p>Compare three ways to go from “I need help” to a first task.</p>
  <nav class="modes" aria-label="Layout examples">
    <button data-mode="directory" aria-pressed="true">Browse tools</button>
    <button data-mode="goal" aria-pressed="false">Choose a task</button>
    <button data-mode="chat" aria-pressed="false">From a draft</button>
  </nav>
  <div class="work">
    <section aria-labelledby="heading">
      <h2 id="heading"></h2><p id="intro"></p>
      <div class="draft" id="draftBox" hidden>
        <label for="draft">Your draft</label><textarea id="draft" placeholder="Try “plan my tasks” or “find a page”"></textarea>
      </div>
      <div id="filters" class="filters" aria-label="Tool type">
        <button data-type="Connector" aria-pressed="true">Connectors</button><button data-type="Plugin" aria-pressed="false">Plugins</button>
      </div>
      <div id="choices" class="choices" aria-label="Available examples"></div>
    </section>
    <aside aria-label="How to use the selected tool">
      <div class="muted" id="kind"></div><h2 id="name"></h2>
      <p id="how"></p><p id="prompt" class="example"></p>
      <button id="try" class="action" type="button"></button>
      <div id="sample" hidden><ol id="tasks" class="tasks"></ol></div>
      <div id="editor" class="draft" hidden><label for="exampleDraft">Example draft</label><textarea id="exampleDraft"></textarea></div>
    </aside>
  </div>
</main>
<script>
'use strict'
const tools = [
  { name:'Notion', type:'Connector', goal:'Find a page', hint:'Look up notes in your workspace.',
    how:'In Hebri, open Extensions → Connectors, choose Notion, and complete setup for the workspace you want to use. Then ask about a page you can access.',
    example:'Find my meeting notes in Notion and summarize the decisions.', keywords:['notion','page','meeting','notes','document'] },
  { name:'Todoist', type:'Connector', goal:'Plan my tasks', hint:'See what is due next.',
    how:'In Hebri, open Extensions → Connectors, choose Todoist, and complete setup for your account. Start by asking for a list of tasks.',
    example:'List my Todoist tasks due this week, grouped by day.', keywords:['todoist','task','due','week','plan'] },
  { name:'Kanban', type:'Plugin', goal:'Organize work on a board', hint:'Track a task from start to finish.',
    how:'In Hebri, open Extensions → Plugins and find Kanban. Once enabled, open its board to see which tasks are ready, running, or done.',
    example:'Start with a board and follow one task from its initial column to completion.', keywords:['kanban','board','column','track'] }
]
const modes = {
  directory:['Browse tools','Connectors bring your apps into Hebri. Plugins add features to the workspace.'],
  goal:['What are you trying to do?','Choose a task to see which tool can help and how to start.'],
  chat:['Which tool fits this draft?','Write a few words. Matching tools appear below as you type.']
}
const el = id => document.getElementById(id)
let mode = 'directory', type = 'Connector', selected = tools[0]
const drafts = new Map()
function renderDetail(tool) {
  selected = tool
  el('kind').textContent = tool.type
  el('name').textContent = tool.name
  el('how').textContent = tool.how
  el('prompt').textContent = tool.example
  el('try').textContent = tool.type === 'Plugin' ? 'Preview a board' : 'Try the example draft'
  el('try').setAttribute('aria-expanded', 'false')
  el('try').setAttribute('aria-controls', tool.type === 'Plugin' ? 'sample' : 'editor')
  el('editor').hidden = true
  el('sample').hidden = true
  document.querySelectorAll('[data-tool]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.tool === tool.name)))
}
function renderChoices() {
  const draft = el('draft').value.toLowerCase()
  const matched = tools.filter(tool => tool.keywords.some(word => draft.includes(word)))
  const visible = mode === 'directory' ? tools.filter(tool => tool.type === type)
    : mode === 'chat' && draft.trim() ? matched : tools
  el('choices').replaceChildren()
  if (!visible.length) {
    el('choices').textContent = 'No sample tools match. Try “tasks”, “page”, or “board”.'
    document.querySelector('aside').hidden = true
    return
  }
  document.querySelector('aside').hidden = false
  for (const tool of visible) {
    const button = document.createElement('button')
    button.type = 'button'; button.dataset.tool = tool.name
    const text = document.createElement('span'), title = document.createElement('strong'), hint = document.createElement('small')
    title.textContent = mode === 'directory' ? tool.name : tool.goal
    hint.textContent = mode === 'directory' ? tool.hint : tool.name + ' · ' + tool.type
    text.append(title, hint)
    const arrow = document.createElement('span')
    arrow.textContent = '→'; arrow.setAttribute('aria-hidden','true')
    button.append(text, arrow)
    button.addEventListener('click', () => renderDetail(tool))
    el('choices').append(button)
  }
  renderDetail(visible.includes(selected) ? selected : visible[0])
}
function renderMode() {
  el('heading').textContent = modes[mode][0]; el('intro').textContent = modes[mode][1]
  el('filters').hidden = mode !== 'directory'; el('draftBox').hidden = mode !== 'chat'
  document.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-pressed',String(b.dataset.mode === mode)))
  document.querySelectorAll('[data-type]').forEach(b => b.setAttribute('aria-pressed',String(b.dataset.type === type)))
  renderChoices()
}
for (const button of document.querySelectorAll('[data-mode]')) {
  button.addEventListener('click', () => { mode = button.dataset.mode; renderMode() })
}
for (const button of document.querySelectorAll('[data-type]')) {
  button.addEventListener('click', () => { type = button.dataset.type; renderMode() })
}
el('draft').addEventListener('input', renderChoices)
el('try').addEventListener('click', () => {
  if (selected.type === 'Plugin') {
    const opening = el('sample').hidden
    el('tasks').replaceChildren()
    for (const [phase, task] of [['Ready','Write the agenda'],['Running','Review the notes'],['Done','Choose a date']]) {
      const row = document.createElement('li'); row.textContent = phase + ' — ' + task; el('tasks').append(row)
    }
    el('sample').hidden = !opening
    el('try').textContent = opening ? 'Hide board preview' : 'Preview a board'
    el('try').setAttribute('aria-expanded', String(opening))
  } else {
    el('editor').hidden = false
    el('try').setAttribute('aria-expanded','true')
    el('exampleDraft').value = drafts.get(selected.name) ?? selected.example
    el('exampleDraft').focus()
  }
})
el('exampleDraft').addEventListener('input', () => drafts.set(selected.name, el('exampleDraft').value))
renderMode()
</script>
</body>
</html>
