name: One-time protected macOS signing secret migration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-signing-secret-migration
  cancel-in-progress: false

jobs:
  seal:
    if: github.repository == 'Synapsek-Labs/hebri' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: macos-signing-migration
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install hash-locked encryption library before exposing any signing secret
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r scripts/ci/signing-migration-requirements.txt
      - name: Seal existing repository secrets to the fixed GitHub environment public key
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: python scripts/ci/seal_macos_signing_secrets.py
      - name: Retain only GitHub-encrypted values for the environment API
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-signing-encrypted-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/macos-signing-migration.json
          if-no-files-found: error
          retention-days: 1
